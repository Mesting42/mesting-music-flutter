name: ring_download_sdk
description: Verified HTTPS and bounded peer-assisted Android APK downloads for Flutter.
version: 1.1.0
publish_to: none
environment:
  sdk: '>=3.10.8 <4.0.0'
  flutter: '>=3.38.0'
dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_webrtc: 1.6.2+hotfix.3
  crypto: ^3.0.6
  path: ^1.9.1
  path_provider: ^2.1.4
  shared_preferences: ^2.2.3
  package_info_plus: '>=8.0.3 <11.0.0'
  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: asia.csnas.ringdownload
        pluginClass: RingDownloadPlugin
